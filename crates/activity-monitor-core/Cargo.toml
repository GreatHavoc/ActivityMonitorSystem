[package]
name = "activity-monitor-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jiff = { version = "0.2.46", features = ["serde"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
tracing-appender = "0.2.5"
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.13", features = ["json"] }
base64 = "0.22"
# queue.rs is cross-platform since v1.4 (macOS uses the axtext path)
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Accessibility API (focus + text-only capture context) on macOS, v1.4
axuielement = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Security",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
jpeg-encoder = "0.7" # q<90 defaults to 4:2:0 chroma like GDI+; image crate is 4:4:4 and 29% bigger
# Semantic search (v1.2): local CPU ONNX embedder, no GPU (the vision model
# owns it) and no Ollama round-trip. BGE-small-en-v1.5, 384-dim, ~67 MB.
# ort-load-dynamic: ONNX Runtime is dlopen'd at runtime; the prebuilt import
# lib conflicts with current MSVC CRT (LNK2019 __imp__waccess...).
# v1.2 "semantic" search deliberately has NO ML runtime: FTS5 (already inside
# the bundled SQLite) + trigram fuzzy ranking. Rejected after research:
# fastembed/ort cannot link on current MSVC (LNK2019 __imp__waccess...), its
# load-dynamic path needs an externally-sourced onnxruntime.dll, and a
# local-first product should not depend on a C++ runtime it cannot build.

[dev-dependencies]
image = "0.25.10" # probe decode only
tokio = { version = "1", features = ["rt", "sync", "macros", "time", "net", "io-util"] }

[lints]
workspace = true
