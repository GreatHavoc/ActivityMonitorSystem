[package]
name = "activity-monitor-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jiff = { version = "0.2.43", features = ["serde"] }
jiff-tzdb = "0.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
tracing-appender = "0.2.5"
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.13", features = ["json"] }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Security",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
jpeg-encoder = "0.7" # q<90 defaults to 4:2:0 chroma like GDI+; image crate is 4:4:4 and 29% bigger
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
image = "0.25.10" # probe decode only
tokio = { version = "1", features = ["rt", "sync", "macros", "time", "net", "io-util"] }
