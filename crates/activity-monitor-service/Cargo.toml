[package]
name = "activity-monitor-service"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
activity-monitor-core = { path = "../activity-monitor-core" }
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
uuid = { version = "1", features = ["v4"] }
jiff = "0.2"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "net", "io-util"] }
