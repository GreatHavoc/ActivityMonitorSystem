[package]
name = "activity-monitor-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
activity-monitor-core = { path = "../activity-monitor-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jiff = "0.2.43"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "net", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }

[lints]
workspace = true
