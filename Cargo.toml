[workspace]
resolver = "2"
members = [
    "crates/activity-monitor-core",
    "crates/activity-monitor-service",
    "crates/activity-monitor-cli",
    "crates/activity-monitor-mcp",
]

[workspace.package]
edition = "2024"
license = "MIT"

# Cargo 1.100 lint: report crate dependencies a target never uses.
[workspace.lints.cargo]
unused_dependencies = "warn"
